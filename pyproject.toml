[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "convo-porter"
version = "0.3.1"
description = "Transfer conversations among Claude Code, Codex CLI, and Cursor Agent"
requires-python = ">=3.10"

[project.optional-dependencies]
dev = ["pytest>=9.0"]

[project.scripts]
convo-porter = "convo_porter:main"

[tool.hatch.build.targets.wheel.force-include]
"claude" = "claude"
"agents" = "agents"
